schema_version: "1.1"
name: greenfield-standard-ts
expected_outcome: |
  A Standard Production TypeScript API is scaffolded: lockfile, strict tsconfig, formatter/linter, a test runner with a passing test, environment variables validated at startup with an .env.example, a CI workflow that runs the same lint/typecheck/test commands, a pre-commit hook with a secret check (a minimal one is fine), and an AGENTS.md with verified commands. It creates no documents beyond README.md and AGENTS.md (no ADR, ROADMAP.md, CLAUDE.md bridge, or research notes), because none were requested. The agent runs install, lint, typecheck and tests and reports results. It does not add Strict Enterprise extras such as OpenTelemetry, SBOM gates or a devcontainer.
